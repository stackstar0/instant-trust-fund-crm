name: Deploy to Hostinger Web App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 65002 
          script: |
            # Navigate to the main directory for your domain
            cd domains/instanttrustfunds.com/public_html
            
            # Pull the latest code (Requires you to have run 'git clone' in this folder once previously)
            git pull origin main
            
            # Install dependencies and build everything natively
            npm install
            npm run build:all
            
            # Note: We do not run PM2 or Nginx restarts here. 
            # Hostinger's Node.js Web App feature handles the app restarting automatically 
            # when files are updated, or you can click "Restart" in the hPanel Web App dashboard.
